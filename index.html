<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICRO BANANA</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">MICRO <span class="brand-highlight">BANANA</span></h1>
            <p class="app-subtitle">Text-to-Image &bull; Image-to-Image &bull; Style Blending</p>
        </header>

        <nav class="mode-tabs">
            <button class="tab-btn active" data-mode="txt2img">Text to Image</button>
            <button class="tab-btn" data-mode="img2img">Image to Image</button>
            <button class="tab-btn" data-mode="blend">Style Blend</button>
        </nav>

        <main class="main-content">
            <!-- Text to Image Mode -->
            <section id="txt2img-panel" class="mode-panel active">
                <div class="input-group">
                    <label for="txt2img-prompt">Prompt</label>
                    <textarea id="txt2img-prompt" rows="3" placeholder="Describe the image you want to generate..."></textarea>
                </div>
                <div class="options-row">
                    <div class="input-group half">
                        <label for="txt2img-model">Model</label>
                        <select id="txt2img-model">
                            <option value="auto">Auto (Priority Chain)</option>
                            <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 Schnell</option>
                            <option value="black-forest-labs/FLUX.1-dev">FLUX.1 Dev</option>
                            <option value="black-forest-labs/FLUX.1-pro">FLUX.1 Pro</option>
                            <option value="black-forest-labs/FLUX.1.1-pro">FLUX 1.1 Pro</option>
                            <option value="google/imagen-4.0-ultra">Imagen 4.0 Ultra</option>
                            <option value="google/imagen-4.0-preview">Imagen 4.0 Preview</option>
                            <option value="google/imagen-4.0-fast">Imagen 4.0 Fast</option>
                            <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image</option>
                            <option value="gemini-2.5-flash-image-preview">Gemini 2.5 Flash Image</option>
                            <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL (Fallback)</option>
                        </select>
                    </div>
                    <div class="input-group quarter">
                        <label for="txt2img-width">Width</label>
                        <input type="number" id="txt2img-width" value="1024" min="256" max="2048" step="64">
                    </div>
                    <div class="input-group quarter">
                        <label for="txt2img-height">Height</label>
                        <input type="number" id="txt2img-height" value="1024" min="256" max="2048" step="64">
                    </div>
                </div>
                <div class="options-row">
                    <div class="input-group half">
                        <label for="txt2img-steps">Steps</label>
                        <input type="number" id="txt2img-steps" value="20" min="1" max="50">
                    </div>
                    <div class="input-group half">
                        <label for="txt2img-seed">Seed (optional)</label>
                        <input type="number" id="txt2img-seed" placeholder="Random">
                    </div>
                </div>
                <div class="toggle-row">
                    <label class="toggle-label">
                        <input type="checkbox" id="txt2img-enhance" checked>
                        <span class="toggle-text">Auto-enhance prompt</span>
                    </label>
                </div>
            </section>

            <!-- Image to Image Mode -->
            <section id="img2img-panel" class="mode-panel">
                <div class="upload-area" id="img2img-upload">
                    <div class="upload-placeholder" id="img2img-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <p>Drop an image here or click to upload</p>
                        <p class="upload-hint">The subject will be preserved while improving quality and style</p>
                    </div>
                    <img id="img2img-preview" class="upload-preview hidden" alt="Input preview">
                    <input type="file" id="img2img-file" accept="image/*" hidden>
                </div>
                <div class="input-group">
                    <label for="img2img-prompt">Transformation Prompt</label>
                    <textarea id="img2img-prompt" rows="3" placeholder="Describe how you want to transform the image... (leave empty for auto-enhancement)"></textarea>
                </div>
                <div class="options-row">
                    <div class="input-group half">
                        <label for="img2img-model">Model</label>
                        <select id="img2img-model">
                            <option value="auto">Auto (Priority Chain)</option>
                            <option value="black-forest-labs/FLUX.1-kontext-pro">FLUX.1 Kontext Pro</option>
                            <option value="black-forest-labs/FLUX.1-kontext-max">FLUX.1 Kontext Max</option>
                            <option value="black-forest-labs/FLUX.1-kontext-dev">FLUX.1 Kontext Dev</option>
                            <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image</option>
                            <option value="gemini-2.5-flash-image-preview">Gemini 2.5 Flash Image</option>
                            <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL (Fallback)</option>
                        </select>
                    </div>
                    <div class="input-group half">
                        <label for="img2img-strength">Prompt Strength</label>
                        <input type="range" id="img2img-strength" min="0.1" max="1.0" step="0.05" value="0.65">
                        <span class="range-value" id="img2img-strength-val">0.65</span>
                    </div>
                </div>
                <div class="toggle-row">
                    <label class="toggle-label">
                        <input type="checkbox" id="img2img-enhance" checked>
                        <span class="toggle-text">Auto-enhance prompt</span>
                    </label>
                </div>
            </section>

            <!-- Style Blend Mode -->
            <section id="blend-panel" class="mode-panel">
                <div class="blend-uploads">
                    <div class="upload-area blend-upload" id="blend-subject-upload">
                        <div class="upload-placeholder" id="blend-subject-placeholder">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <p>Subject Image</p>
                            <p class="upload-hint">First image = subject</p>
                        </div>
                        <img id="blend-subject-preview" class="upload-preview hidden" alt="Subject preview">
                        <input type="file" id="blend-subject-file" accept="image/*" hidden>
                    </div>
                    <div class="blend-arrow">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </div>
                    <div class="upload-area blend-upload" id="blend-style-upload">
                        <div class="upload-placeholder" id="blend-style-placeholder">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                            <p>Style Image</p>
                            <p class="upload-hint">Second image = style</p>
                        </div>
                        <img id="blend-style-preview" class="upload-preview hidden" alt="Style preview">
                        <input type="file" id="blend-style-file" accept="image/*" hidden>
                    </div>
                </div>
                <div class="input-group">
                    <label for="blend-prompt">Blend Prompt (optional)</label>
                    <textarea id="blend-prompt" rows="3" placeholder="Custom blend instructions... (uses default blend prompt if empty)"></textarea>
                </div>
                <div class="options-row">
                    <div class="input-group half">
                        <label for="blend-model">Model</label>
                        <select id="blend-model">
                            <option value="auto">Auto (Priority Chain)</option>
                            <option value="black-forest-labs/FLUX.1-kontext-pro">FLUX.1 Kontext Pro</option>
                            <option value="black-forest-labs/FLUX.1-kontext-max">FLUX.1 Kontext Max</option>
                            <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image</option>
                            <option value="gemini-2.5-flash-image-preview">Gemini 2.5 Flash Image</option>
                        </select>
                    </div>
                    <div class="input-group half">
                        <label for="blend-strength">Blend Strength</label>
                        <input type="range" id="blend-strength" min="0.1" max="1.0" step="0.05" value="0.70">
                        <span class="range-value" id="blend-strength-val">0.70</span>
                    </div>
                </div>
            </section>

            <!-- Generate Button -->
            <button id="generate-btn" class="generate-btn">
                <span class="btn-text">Generate Image</span>
                <span class="btn-loading hidden">
                    <span class="spinner"></span>
                    Generating...
                </span>
            </button>

            <!-- Status / Progress -->
            <div id="status-bar" class="status-bar hidden">
                <div class="status-text" id="status-text"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Result Area -->
            <div id="result-area" class="result-area hidden">
                <div class="result-header">
                    <h3>Generated Image</h3>
                    <div class="result-actions">
                        <button id="download-btn" class="action-btn" title="Download">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Download
                        </button>
                        <button id="reuse-btn" class="action-btn" title="Use as input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="17 1 21 5 17 9"/>
                                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                                <polyline points="7 23 3 19 7 15"/>
                                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                            </svg>
                            Reuse
                        </button>
                    </div>
                </div>
                <div class="result-image-container">
                    <img id="result-image" alt="Generated image">
                </div>
                <div class="result-meta" id="result-meta"></div>
            </div>

            <!-- History -->
            <div id="history-section" class="history-section hidden">
                <h3>Recent Generations</h3>
                <div id="history-grid" class="history-grid"></div>
            </div>
        </main>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
